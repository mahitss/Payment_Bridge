services:
  postgres:
    image: postgres:16-alpine
    container_name: claimbridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: claimbridge
      POSTGRES_PASSWORD: claimbridge_local_dev_only
      POSTGRES_DB: claimbridge_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimbridge -d claimbridge_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
