services:
  postgres:
    image: postgres:16-alpine
    container_name: claimbridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: claimbridge
      POSTGRES_PASSWORD: claimbridge_local_dev_only
      POSTGRES_DB: claimbridge_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimbridge -d claimbridge_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: claimbridge-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025" # SMTP port for email delivery
      - "127.0.0.1:8025:8025" # Web UI to inspect test emails
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATABASE: ""

volumes:
  postgres_data:
