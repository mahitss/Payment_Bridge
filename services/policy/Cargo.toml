[package]
name = "claimbridge-policy"
version = "0.1.0"
edition = "2021"
authors = ["ClaimBridge Team"]
description = "Deterministic financial safety policy engine for ClaimBridge payouts"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[[bin]]
name = "claimbridge-policy"
path = "src/main.rs"

[lib]
name = "claimbridge_policy"
path = "src/lib.rs"
