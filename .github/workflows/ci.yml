name: ClaimBridge CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-go:
    name: Go API (Gate & Orchestrator)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: claimbridge
          POSTGRES_PASSWORD: claimbridge_test_password
          POSTGRES_DB: claimbridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: services/api
    env:
      TEST_DATABASE_URL: postgres://claimbridge:claimbridge_test_password@localhost:5432/claimbridge_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum

      - name: Go Vet
        run: go vet ./...

      - name: Run Go Unit Tests
        run: go test -v -race ./...

      - name: Run PostgreSQL Seeder Integration Test
        run: go test -v -race -run TestSeeder_PostgresIntegration ./internal/seeder

      - name: Compile Binaries
        run: |
          go build -v -o bin/server ./cmd/server
          go build -v -o bin/paypal-smoke ./cmd/paypal-smoke
          go build -v -o bin/readiness ./cmd/readiness
          go build -v -o bin/acceptance ./cmd/acceptance
          go build -v -o bin/seed ./cmd/seed

      - name: Run Full Acceptance Suite (32 Scenarios)
        run: go run ./cmd/acceptance

  test-rust:
    name: Rust Deterministic Policy Engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/policy
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check Formatting
        run: cargo fmt --check

      - name: Clippy Linter
        run: cargo clippy -- -D warnings

      - name: Run Deterministic Unit Tests
        run: cargo test --verbose

      - name: Compile Release Binary
        run: cargo build --release

  test-web:
    name: Next.js Web Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint Next.js
        run: npm run lint

      - name: Build Next.js Production Bundle
        run: npm run build

  e2e:
    name: End-to-End Browser & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: claimbridge
          POSTGRES_PASSWORD: claimbridge_test_password
          POSTGRES_DB: claimbridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://claimbridge:claimbridge_test_password@localhost:5432/claimbridge_test?sslmode=disable
      TEST_DATABASE_URL: postgres://claimbridge:claimbridge_test_password@localhost:5432/claimbridge_test?sslmode=disable
      PORT: "8080"
      APP_ENV: development
      SESSION_SECRET: test_session_secret_at_least_32_characters_long_for_security!
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      NEXT_PUBLIC_DEMO_MODE: "true"
      PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Verify PostgreSQL Readiness
        run: |
          echo "Waiting for PostgreSQL service container to accept connections..."
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U claimbridge; then
              echo "PostgreSQL is ready and accepting connections."
              break
            fi
            echo "Waiting for PostgreSQL ($i/30)..."
            sleep 1
            if [ "$i" -eq 30 ]; then
              echo "PostgreSQL failed to become ready within 30 seconds" >&2
              exit 1
            fi
          done

      - name: Compile Server and Seed Database
        working-directory: services/api
        run: |
          go build -o bin/server ./cmd/server
          go run ./cmd/seed -reset

      - name: Start Go API Gateway
        working-directory: services/api
        run: |
          ./bin/server > api.log 2>&1 &
          ready=0
          for i in {1..30}; do
            if curl -s http://localhost:8080/healthz | grep -q '"status":"ok"'; then
              echo "Go API Gateway is ready"
              ready=1
              break
            fi
            echo "Waiting for Go API ($i/30)..."
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Go API Gateway failed to become ready within 30 seconds" >&2
            cat api.log
            exit 1
          fi

      - name: Build and Start Next.js Frontend
        working-directory: apps/web
        env:
          NEXT_PUBLIC_DEMO_MODE: "true"
        run: |
          npm run build
          npm run start &
          ready=0
          for i in {1..30}; do
            if curl -s -f http://localhost:3000/ > /dev/null; then
              echo "Next.js Frontend is ready"
              ready=1
              break
            fi
            echo "Waiting for Next.js ($i/30)..."
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Next.js Frontend failed to become ready within 30 seconds" >&2
            exit 1
          fi

      - name: Provision Media Inspection Tool (ffprobe)
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            echo "Installing ffmpeg/ffprobe deterministically..."
            sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
          else
            echo "ffprobe is already installed."
          fi
          ffprobe -version | head -n 1

      - name: Run Playwright Browser Tests
        working-directory: apps/web
        run: |
          set -o pipefail
          npx playwright test --reporter=list,html 2>&1 | tee playwright.log || {
            status=$?
            echo "### Playwright Test Failures" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 playwright.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -i -E '(Error:|✕|failed|TimeoutError|expected|received)' playwright.log | head -n 40 | while IFS= read -r line; do
              echo "::error title=Playwright Failure::$line"
            done
            exit $status
          }

      - name: Upload Playwright Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Upload Server Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-logs
          path: services/api/api.log
          retention-days: 7

      - name: Print Diagnostic Logs on Failure
        if: failure()
        run: |
          echo "=== RECENT API LOGS ==="
          tail -n 100 services/api/api.log 2>/dev/null || true
          echo "=== RECENT PLAYWRIGHT LOGS ==="
          tail -n 100 apps/web/playwright.log 2>/dev/null || true

  security-checks:
    name: Security & Secret Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for Uncommitted Secrets or Untracked Env
        run: |
          echo "Verifying no private keys or active secrets are tracked..."
          ! git ls-files | grep -E '(\.env$|\.key$|\.pem$|credentials\.json)'
          echo "Secret check passed."

      - name: Verify Sandbox Enforcement
        run: |
          echo "Verifying PAYPAL_ENV defaults strictly to sandbox..."
          grep "PAYPAL_ENV=sandbox" .env.example

  docker-compose-evaluator:
    name: Docker Compose Offline Evaluator Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js for Playwright E2E
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Free Host Port 5432 and Prepare Environment
        run: |
          echo "Stopping any host-level PostgreSQL service to free port 5432..."
          sudo systemctl stop postgresql 2>/dev/null || true
          sudo systemctl disable postgresql 2>/dev/null || true

      - name: Build Go API Container Image
        run: |
          echo "Building API multi-stage Docker image..."
          docker compose -f infra/docker-compose.full.yml build api

      - name: Build Next.js Web Container Image (with Evaluator Mode)
        run: |
          echo "Building Web multi-stage Docker image with NEXT_PUBLIC_DEMO_MODE=true..."
          docker compose -f infra/docker-compose.full.yml -f infra/docker-compose.demo.yml build web

      - name: Launch Isolated Evaluator Demo Stack
        run: |
          echo "Starting Docker Compose offline evaluator demo stack..."
          docker compose -f infra/docker-compose.full.yml -f infra/docker-compose.demo.yml up -d

      - name: Wait for Stack Health and Seeder Completion
        run: |
          echo "Waiting for PostgreSQL, API Gateway, Seeder, and Next.js Web containers..."
          
          # Wait for Seeder to exit with code 0
          echo "Waiting for claimbridge-seeder to complete successfully..."
          seeder_ok=0
          for i in {1..60}; do
            status=$(docker inspect claimbridge-seeder --format '{{.State.Status}}' 2>/dev/null || echo "not_found")
            exit_code=$(docker inspect claimbridge-seeder --format '{{.State.ExitCode}}' 2>/dev/null || echo "-1")
            if [ "$status" = "exited" ]; then
              if [ "$exit_code" = "0" ]; then
                echo "claimbridge-seeder completed successfully with exit code 0."
                seeder_ok=1
                break
              else
                echo "claimbridge-seeder failed with exit code $exit_code" >&2
                docker logs claimbridge-seeder
                exit 1
              fi
            fi
            echo "Waiting for seeder ($i/60, status=$status)..."
            sleep 2
          done
          if [ "$seeder_ok" -ne 1 ]; then
            echo "claimbridge-seeder did not complete within bounded timeout" >&2
            docker logs claimbridge-seeder
            exit 1
          fi

          # Wait for API Gateway healthz
          echo "Waiting for Go API Gateway (claimbridge-api) /healthz..."
          api_ok=0
          for i in {1..30}; do
            if curl -fsSL http://127.0.0.1:8080/healthz | grep -q '"status":"ok"'; then
              echo "Go API Gateway is healthy"
              api_ok=1
              break
            fi
            echo "Waiting for API Gateway ($i/30)..."
            sleep 1
          done
          if [ "$api_ok" -ne 1 ]; then
            echo "Go API Gateway failed to become healthy within 30 seconds" >&2
            docker logs claimbridge-api
            exit 1
          fi

          # Wait for Web Frontend
          echo "Waiting for Next.js Web Frontend (claimbridge-web)..."
          web_ok=0
          for i in {1..40}; do
            if curl -fsSL http://127.0.0.1:3000/ > /dev/null 2>&1; then
              echo "Next.js Web Frontend is ready"
              web_ok=1
              break
            fi
            echo "Waiting for Web Frontend ($i/40)..."
            sleep 2
          done
          if [ "$web_ok" -ne 1 ]; then
            echo "Next.js Frontend failed to become ready within 80 seconds" >&2
            docker logs claimbridge-web
            exit 1
          fi

      - name: Verify Health, Readiness, and Evaluator Banner Contracts
        run: |
          echo "Verifying /healthz contract directly on API..."
          curl -fsSL http://127.0.0.1:8080/healthz | grep -q '"status":"ok"'
          
          echo "Verifying /readyz contract directly on API..."
          curl -fsSL http://127.0.0.1:8080/readyz | grep -q '"database":"connected"'
          curl -fsSL http://127.0.0.1:8080/readyz | grep -q '"status":"ready"'

          echo "Verifying Next.js reverse-proxy rewrite to /healthz..."
          curl -fsSL http://127.0.0.1:3000/healthz | grep -q '"service":"claimbridge-api"'

          echo "Verifying Next.js reverse-proxy rewrite to /readyz..."
          curl -fsSL http://127.0.0.1:3000/readyz | grep -q '"database":"connected"'
          curl -fsSL http://127.0.0.1:3000/readyz | grep -q '"status":"ready"'

          echo "Verifying build-time NEXT_PUBLIC_DEMO_MODE compilation in HTML..."
          landing_html=$(curl -fsSL http://127.0.0.1:3000/)
          echo "$landing_html" | grep -q "Local Evaluation Fixtures (Demo Mode Enabled)"
          echo "$landing_html" | grep -q "operator@claimbridge.internal"
          echo "Evaluator banner successfully verified in containerized bundle."

      - name: Run Playwright E2E Suite Against Docker Compose Stack
        working-directory: apps/web
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:3000
        run: |
          set -o pipefail
          npx playwright test --reporter=list,html 2>&1 | tee playwright-compose.log || {
            status=$?
            echo "### Playwright Compose Test Failures" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 playwright-compose.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $status
          }

      - name: Provision Media Inspection Tool (ffprobe)
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            echo "Installing ffmpeg/ffprobe deterministically..."
            sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
          else
            echo "ffprobe is already installed."
          fi
          ffprobe -version | head -n 1

      - name: Verify and Report Demo Video Recording Artifact
        working-directory: apps/web
        run: |
          node scripts/verify-recording-artifact.mjs

      - name: Upload Demo Walkthrough Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: claimbridge-offline-demo-recording
          path: apps/web/test-results/demo-recording/claimbridge-demo-walkthrough.webm
          retention-days: 14

      - name: Test Clean-State, Idempotency, and Stack Restart Behavior
        run: |
          echo "Testing seeder idempotency: running seeder a second time..."
          docker compose -f infra/docker-compose.full.yml -f infra/docker-compose.demo.yml run --rm seeder
          echo "Seeder re-run passed with exit code 0."

          echo "Testing restart behavior: restarting api and web containers..."
          docker compose -f infra/docker-compose.full.yml -f infra/docker-compose.demo.yml restart api web

          echo "Verifying API is healthy and database is connected after restart..."
          for i in {1..30}; do
            if curl -fsSL http://127.0.0.1:8080/readyz | grep -q '"database":"connected"'; then
              echo "API is healthy and database is connected after restart."
              break
            fi
            sleep 1
          done

          echo "Verifying landing page and evaluator banner after restart..."
          for i in {1..30}; do
            if curl -fsSL http://127.0.0.1:3000/ | grep -q "Local Evaluation Fixtures (Demo Mode Enabled)"; then
              echo "Next.js web container restarted and serving evaluator demo banner."
              break
            fi
            sleep 1
          done

      - name: Upload Playwright Test Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-compose-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Collect Container Logs on Failure
        if: failure()
        run: |
          echo "=== DOCKER COMPOSE LOGS (ON FAILURE) ==="
          docker compose -f infra/docker-compose.full.yml -f infra/docker-compose.demo.yml logs --tail 200
          echo "### Docker Compose Container Logs" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          docker compose -f infra/docker-compose.full.yml -f infra/docker-compose.demo.yml logs --tail 200 >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Tear Down Docker Compose Stack
        if: always()
        run: |
          echo "Tearing down Docker Compose containers and volumes..."
          docker compose -f infra/docker-compose.full.yml -f infra/docker-compose.demo.yml down -v --remove-orphans
