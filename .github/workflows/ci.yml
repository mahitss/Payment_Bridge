name: ClaimBridge CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-go:
    name: Go API (Gate & Orchestrator)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: claimbridge
          POSTGRES_PASSWORD: claimbridge_test_password
          POSTGRES_DB: claimbridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: services/api
    env:
      TEST_DATABASE_URL: postgres://claimbridge:claimbridge_test_password@localhost:5432/claimbridge_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum

      - name: Go Vet
        run: go vet ./...

      - name: Run Go Unit Tests
        run: go test -v -race ./...

      - name: Compile Binaries
        run: |
          go build -v -o bin/server ./cmd/server
          go build -v -o bin/paypal-smoke ./cmd/paypal-smoke
          go build -v -o bin/acceptance ./cmd/acceptance

      - name: Run Full Acceptance Suite (32 Scenarios)
        run: go run ./cmd/acceptance

  test-rust:
    name: Rust Deterministic Policy Engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/policy
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check Formatting
        run: cargo fmt --check

      - name: Clippy Linter
        run: cargo clippy -- -D warnings

      - name: Run Deterministic Unit Tests
        run: cargo test --verbose

      - name: Compile Release Binary
        run: cargo build --release

  test-web:
    name: Next.js Web Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint Next.js
        run: npm run lint

      - name: Build Next.js Production Bundle
        run: npm run build

  security-checks:
    name: Security & Secret Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for Uncommitted Secrets or Untracked Env
        run: |
          echo "Verifying no private keys or active secrets are tracked..."
          ! git ls-files | grep -E '(\.env$|\.key$|\.pem$|credentials\.json)'
          echo "Secret check passed."

      - name: Verify Sandbox Enforcement
        run: |
          echo "Verifying PAYPAL_ENV defaults strictly to sandbox..."
          grep "PAYPAL_ENV=sandbox" .env.example
